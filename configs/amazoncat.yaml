dataset:
  name: amazoncat
  num_labels: 5753
  num_seen_labels: 5000
  num_unseen_labels: 753
  data_mode: jsonl_offsets
  require_dev_no_unseen: true
  label_text_fields:
  - title
  - label
  - content
paths:
  train: data/AmazonCat-13K_sub/trn.json
  dev: data/AmazonCat-13K_sub/dev.json
  labels: data/AmazonCat-13K_sub/lbl.json
  label_embeddings: data/AmazonCat-13K_sub/lbl_embs_qwen_amzn.npy
  synthetic: data/AmazonCat-13K_sub/synthetic_unseen_amzn.json
  test: data/AmazonCat-13K_sub/tst.json
model:
  document_encoder: distilbert-base-uncased
  label_embedding_source: precomputed:Qwen/Qwen3-Embedding-4B
  label_embedding_dimension: 2560
  max_document_length: 512
  dropout: 0.1
  gradient_checkpointing: false
seen_training:
  batch_size: 8
  dev_batch_size: 16
  epochs: 50
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_pos_weight: 100.0
  gradient_clip_norm: 1.0
  label_chunk_size: 512
  eval_label_chunk_size: 512
  dev_monitor_documents: 6000
  scheduler: none
  warmup_steps: 0
  num_workers: 2
  seed: 42
  use_amp: true
  skip_nonfinite_gradients: true
  print_every_batches: 100
  resume_checkpoint: null
  resume_epoch: 0
  resume_if_available: true
outputs:
  seen_checkpoint: data/AmazonCat-13K_sub/model/base_seen.pt
  seen_training_state: data/AmazonCat-13K_sub/model/base_seen_training_state.pt
  seen_history: data/AmazonCat-13K_sub/training_metrics/seen_history.json
  unseen_checkpoint: data/AmazonCat-13K_sub/model/base_seen_plus_unseen.pt
  unseen_history: data/AmazonCat-13K_sub/training_metrics/unseen_history.json
  evaluation_results: data/AmazonCat-13K_sub/eval/evaluation_results.json
unseen_training:
  batch_size: 16
  val_batch_size: 16
  epochs: 50
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_pos_weight: 5.0
  gradient_clip_norm: 1.0
  adapter_hidden_size: 256
  adapter_dropout: 0.1
  examples_per_label: 10
  synthetic_train_per_label: 8
  synthetic_val_per_label: 2
  num_workers: 2
  seed: 42
  use_amp: true
  skip_nonfinite_gradients: true
  print_every_steps: 50
evaluation:
  batch_size: 8
  label_chunk_size: 512
  ranking_k:
  - 1
  - 3
  - 5
  - 10
  - 25
  zsr_k:
  - 5
  - 10
  - 25
  - 50
  - 100
  num_workers: 0
  seed: 42
  use_amp: true
  allow_tf32: false
  print_every_batches: 250
  max_test_documents: null
  psp:
    enabled: true
    a: 0.55
    b: 1.5
  classification:
    enabled: true
    threshold_mode: fixed
    seen_threshold: 0.95
    unseen_threshold: 0.95
generation:
  generator_model: Qwen/Qwen3-4B-Instruct-2507
  examples_per_label: 10
  neighbours_per_label: 50
  demonstrations_per_generation: 5
  max_generation_attempts: 3
  max_demonstration_chars: 1800
  max_new_tokens: 1800
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.05
  seed: 42
  document_type: product description

